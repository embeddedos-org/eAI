name: CI

on:
  workflow_dispatch:
  repository_dispatch:
    types: [dependency-update]
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
          - os: macos-latest
            compiler: apple-clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -B build
          -DEAI_BUILD_TESTS=ON
          -DEAI_BUILD_ACCEL=ON
          -DEAI_BUILD_FORMATS=ON
          -DEAI_BUILD_MIN=ON
          -DEAI_BUILD_FRAMEWORK=ON
          -DEAI_BUILD_BCI=ON
          -DEAI_BUILD_CLI=ON

      - name: Configure (Windows / MSVC)
        if: runner.os == 'Windows'
        run: >
          cmake -B build
          -DEAI_BUILD_TESTS=ON
          -DEAI_BUILD_ACCEL=ON
          -DEAI_BUILD_FORMATS=ON
          -DEAI_BUILD_MIN=ON
          -DEAI_BUILD_FRAMEWORK=ON
          -DEAI_BUILD_BCI=ON
          -DEAI_BUILD_CLI=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release --parallel 4

  cross-compile:
    name: Cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            pkg: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            cmake_system: Linux
            qemu: qemu-aarch64
            qemu_pkg: qemu-user
            qemu_prefix: /usr/aarch64-linux-gnu
            size_tool: aarch64-linux-gnu-size
            can_test: true
          - target: linux-armhf
            pkg: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            cmake_system: Linux
            qemu: qemu-arm
            qemu_pkg: qemu-user
            qemu_prefix: /usr/arm-linux-gnueabihf
            size_tool: arm-linux-gnueabihf-size
            can_test: true
          - target: linux-riscv64
            pkg: gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
            cc: riscv64-linux-gnu-gcc
            cmake_system: Linux
            qemu: qemu-riscv64
            qemu_pkg: qemu-user
            qemu_prefix: /usr/riscv64-linux-gnu
            size_tool: riscv64-linux-gnu-size
            can_test: true
          - target: cortex-m4
            pkg: gcc-arm-none-eabi
            cc: arm-none-eabi-gcc
            cmake_system: Generic
            toolchain: cmake/toolchains/toolchain-arm-cortex-m4.cmake
            size_tool: arm-none-eabi-size
            can_test: false

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.pkg }}
          if [ "${{ matrix.qemu_pkg }}" != "" ]; then
            sudo apt-get install -y ${{ matrix.qemu_pkg }}
          fi

      - name: Configure
        run: |
          CMAKE_ARGS="-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_SYSTEM_NAME=${{ matrix.cmake_system }}"
          if [ "${{ matrix.toolchain }}" != "" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }}"
            CMAKE_ARGS="$CMAKE_ARGS -DEAI_BUILD_TESTS=OFF -DEAI_BUILD_CLI=OFF -DEAI_BUILD_FRAMEWORK=OFF -DEAI_BUILD_BCI=OFF"
            CMAKE_ARGS="$CMAKE_ARGS -DEAI_HAL_THREAD=OFF -DEAI_HAL_FS=OFF -DEAI_HAL_NET=OFF"
          else
            CMAKE_ARGS="$CMAKE_ARGS -DEAI_BUILD_TESTS=ON -DEAI_BUILD_ACCEL=ON -DEAI_BUILD_FORMATS=ON"
          fi
          cmake -B build $CMAKE_ARGS

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test via QEMU user-mode
        if: ${{ matrix.can_test }}
        run: |
          export QEMU_LD_PREFIX=${{ matrix.qemu_prefix }}
          cd build && ctest --output-on-failure --parallel 4

      - name: Report binary sizes
        if: ${{ !matrix.can_test }}
        run: |
          echo "=== Binary sizes ==="
          ${{ matrix.size_tool }} build/common/libeai_common.a 2>/dev/null || echo "(libeai_common.a not produced)"
          ${{ matrix.size_tool }} build/platform/libeai_platform.a 2>/dev/null || echo "(libeai_platform.a not produced)"
          ${{ matrix.size_tool }} build/min/libeai_min.a 2>/dev/null || echo "(libeai_min.a not produced)"

  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            api: 26
          - abi: armeabi-v7a
            api: 26

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_NATIVE_API_LEVEL=${{ matrix.api }} \
            -DEAI_BUILD_TESTS=OFF \
            -DEAI_BUILD_CLI=OFF \
            -DEAI_BUILD_ACCEL=ON \
            -DEAI_BUILD_FORMATS=ON \
            -DEAI_BUILD_MIN=ON \
            -DEAI_BUILD_FRAMEWORK=OFF \
            -DEAI_BUILD_BCI=OFF

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Report library sizes
        run: |
          echo "=== Android ${{ matrix.abi }} library sizes ==="
          find build -name '*.a' | sort | while read f; do
            SIZE=$(stat --printf="%s" "$f")
            printf "  %-40s %d KB\n" "$(basename $f)" "$((SIZE / 1024))"
          done

  conan-build:
    name: Conan Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect conanfile.py
        id: detect
        run: |
          if [ -f conanfile.py ] || [ -f conanfile.txt ]; then
            echo "has_conan=true" >> $GITHUB_OUTPUT
          else
            echo "has_conan=false" >> $GITHUB_OUTPUT
            echo "::notice::No conanfile.py / conanfile.txt found, skipping Conan build"
          fi
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.has_conan == 'true'
        with:
          python-version: "3.11"
      - name: Install Conan
        if: steps.detect.outputs.has_conan == 'true'
        run: pip install --upgrade conan
      - name: Conan profile
        if: steps.detect.outputs.has_conan == 'true'
        run: conan profile detect --force
      - name: Conan create
        if: steps.detect.outputs.has_conan == 'true'
        run: conan create . --build=missing

  container:
    name: Container (Docker)
    runs-on: ubuntu-latest
    container:
      image: gcc:13
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: apt-get update && apt-get install -y cmake
      - name: Configure
        run: |
          cmake -B build \
            -DEAI_BUILD_TESTS=ON \
            -DEAI_BUILD_ACCEL=ON \
            -DEAI_BUILD_FORMATS=ON \
            -DEAI_PLATFORM_CONTAINER=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test
        run: cd build && ctest --output-on-failure --parallel 4

  build-profiles:
    name: Profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: adaptive-edge
            flags: "-DEAI_PROFILE_ADAPTIVE_EDGE=ON"
          - profile: bci-assistive
            flags: "-DEAI_PROFILE_BCI_ASSISTIVE=ON"
          - profile: industrial-gateway
            flags: "-DEAI_PROFILE_INDUSTRIAL_GATEWAY=ON"
          - profile: mobile-edge
            flags: "-DEAI_PROFILE_MOBILE_EDGE=ON"
          - profile: robot-controller
            flags: "-DEAI_PROFILE_ROBOT_CONTROLLER=ON"
          - profile: smart-camera
            flags: "-DEAI_PROFILE_SMART_CAMERA=ON"
    steps:
      - uses: actions/checkout@v4
      - name: Build profile (${{ matrix.profile }})
        run: |
          cmake -B build \
            -DEAI_BUILD_TESTS=OFF \
            -DEAI_BUILD_MIN=ON \
            -DEAI_BUILD_FRAMEWORK=ON \
            -DEAI_BUILD_BCI=ON \
            -DEAI_BUILD_ACCEL=ON \
            -DEAI_BUILD_FORMATS=ON \
            ${{ matrix.flags }}
          cmake --build build --parallel $(nproc)

  sanitize:
    name: Sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with ASAN/UBSAN
        run: |
          cmake -B build \
            -DEAI_BUILD_TESTS=ON \
            -DEAI_BUILD_ACCEL=ON \
            -DEAI_BUILD_FORMATS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          cmake --build build --parallel $(nproc)
      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure --parallel 4

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            --inline-suppr \
            -I common/include -I platform/include -I accel/include -I formats/include \
            common/src platform/src accel/src formats/src

  ci-gate:
    name: CI Gate
    if: always()
    needs: [build, cross-compile, android, container, sanitize, static-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "Native build:     ${{ needs.build.result }}"
          echo "Cross-compile:    ${{ needs.cross-compile.result }}"
          echo "Android:          ${{ needs.android.result }}"
          echo "Container:        ${{ needs.container.result }}"
          echo "Sanitizers:       ${{ needs.sanitize.result }}"
          echo "Static analysis:  ${{ needs.static-analysis.result }}"
          for r in "${{ needs.build.result }}" "${{ needs.cross-compile.result }}" "${{ needs.android.result }}" "${{ needs.container.result }}" "${{ needs.sanitize.result }}" "${{ needs.static-analysis.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::CI gate failed (one or more jobs did not succeed)"
              exit 1
            fi
          done
          echo "✅ CI gate passed"
