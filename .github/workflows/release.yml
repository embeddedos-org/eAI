name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Test
        run: |
          cmake -B build -DEAI_BUILD_TESTS=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  linux-build:
    name: Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-linux
            cc: gcc
            pkg: ""
          - arch: aarch64-linux
            cc: aarch64-linux-gnu-gcc
            pkg: gcc-aarch64-linux-gnu
          - arch: arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            pkg: gcc-arm-linux-gnueabihf
          - arch: riscv64-linux
            cc: riscv64-linux-gnu-gcc
            pkg: gcc-riscv64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compiler
        if: matrix.pkg != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.pkg }}
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Package
        run: |
          mkdir -p staging/include staging/lib
          find build -name "*.a" -exec cp {} staging/lib/ \;
          for d in common framework min bci platform accel formats; do
            cp -r ${d}/include/* staging/include/ 2>/dev/null || true
          done
          tar czf eai-${{ steps.version.outputs.version }}-${{ matrix.arch }}.tar.gz -C staging .
      - uses: actions/upload-artifact@v4
        with:
          name: eai-${{ matrix.arch }}
          path: "*.tar.gz"

  macos-build:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-13
            cmake_arch: x86_64
          - arch: arm64
            runner: macos-14
            cmake_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }}
          cmake --build build --parallel
      - name: Package
        run: |
          mkdir -p staging/include staging/lib
          find build -name "*.a" -exec cp {} staging/lib/ \;
          for d in common framework min bci platform accel formats; do
            cp -r ${d}/include/* staging/include/ 2>/dev/null || true
          done
          tar czf eai-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.tar.gz -C staging .
      - uses: actions/upload-artifact@v4
        with:
          name: eai-macos-${{ matrix.arch }}
          path: "*.tar.gz"

  windows-build:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: arm64
            cmake_arch: ARM64
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Configure
        run: cmake -B build -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: bash
        run: |
          mkdir -p staging/include staging/lib
          find build -name "*.lib" -exec cp {} staging/lib/ \; 2>/dev/null || true
          find build -name "*.a" -exec cp {} staging/lib/ \; 2>/dev/null || true
          for d in common framework min bci platform accel formats; do
            cp -r ${d}/include/* staging/include/ 2>/dev/null || true
          done
          BASE="eai-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}"
          tar czf "${BASE}.tar.gz" -C staging .
          (cd staging && 7z a -tzip "../${BASE}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: eai-windows-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.zip

  android-build:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            api: 26
          - abi: armeabi-v7a
            api: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_NATIVE_API_LEVEL=${{ matrix.api }} \
            -DBUILD_SHARED_LIBS=ON \
            -DEAI_BUILD_TESTS=OFF -DEAI_BUILD_CLI=OFF \
            -DEAI_BUILD_ACCEL=ON -DEAI_BUILD_FORMATS=ON -DEAI_BUILD_MIN=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Package
        run: |
          mkdir -p staging
          find build -name "*.so" -exec cp {} staging/ \;
          tar czf eai-${{ steps.version.outputs.version }}-android-${{ matrix.abi }}.tar.gz -C staging .
      - uses: actions/upload-artifact@v4
        with:
          name: eai-android-${{ matrix.abi }}
          path: "*.tar.gz"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate, linux-build, macos-build, windows-build, android-build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: eai-*
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum *.tar.gz *.zip 2>/dev/null > SHA256SUMS.txt || sha256sum *.tar.gz > SHA256SUMS.txt
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign artifacts (cosign keyless)
        run: |
          set -e
          for f in *.tar.gz *.zip; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --bundle "${f}.sig.bundle" "$f"
          done
      - name: Optional Linux GPG signing
        if: env.GPG_KEY != ''
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_KEY" | gpg --batch --import
          for f in *.tar.gz *.zip; do
            [ -f "$f" ] || continue
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --detach-sign --armor "$f"
          done
      - name: Idempotent release create-or-update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — will update artifacts."
          else
            gh release create "$TAG" --title "eAI $TAG" --generate-notes \
              $([ "${{ contains(steps.version.outputs.tag, 'rc') || contains(steps.version.outputs.tag, 'beta') }}" = "true" ] && echo "--prerelease")
          fi
      - name: Attach all artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "eAI ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## eAI ${{ steps.version.outputs.tag }}

            Static libraries for Linux (x86_64, aarch64, armhf, riscv64),
            macOS (x86_64, arm64), Windows (x64, arm64), Android (arm64-v8a, armeabi-v7a).

            ### Integrity & supply-chain
            - `SHA256SUMS.txt` — checksums
            - `sbom.cdx.json` — CycloneDX SBOM
            - `sbom.spdx.json` — SPDX SBOM
            - `*.sig.bundle` — Sigstore cosign keyless signatures
            - `*.asc` — GPG detached signatures (when GPG_KEY secret is set)
          files: |
            *.tar.gz
            *.zip
            *.sig.bundle
            *.asc
            SHA256SUMS.txt
            sbom.cdx.json
            sbom.spdx.json
          prerelease: ${{ contains(steps.version.outputs.tag, 'rc') || contains(steps.version.outputs.tag, 'beta') }}
