name: QEMU Simulation Test
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
env:
  EOSIM_VERSION: "3.0.2"
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulate:
    name: EoSim ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - arm64-linux
          - riscv64-linux
          - stm32f4
          - raspi4
          - vexpress-a9
          - sifive_u
          - qemu-q35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install EoSim
        uses: embeddedos-org/.github/.github/actions/install-eosim@master
        with:
          version: ${{ env.EOSIM_VERSION }}
      - name: Validate platform
        run: eosim list
      - name: Simulate ${{ matrix.platform }}
        shell: bash
        run: |
          echo "=== EoSim Simulation: ${{ matrix.platform }} ==="
          # Honest EoSim engine contracts (EoSim 4db3434a fixed #38):
          # - qemu engine: qemu not installed -> "QEMU NOT INSTALLED", exit 2
          #   (reported as SKIP); qemu installed -> it actually executes and
          #   its exit code propagates. Never PASSED without execution.
          # - native engine: "NO FIRMWARE", exit 2 (no fake pass over zeroed
          #   memory). Real firmware execution needs a built image.
          set +e
          out=$(eosim run ${{ matrix.platform }} --headless --timeout 15 2>&1)
          code=$?
          set -e
          echo "$out"
          if echo "$out" | grep -q "via qemu"; then
            if echo "$out" | grep -q "QEMU NOT INSTALLED"; then
              [ "$code" -eq 2 ] || { echo "::error::expected exit 2, got $code"; exit 1; }
              echo "${{ matrix.platform }}: SKIP (qemu not installed)"
            else
              [ "$code" -eq 0 ] || { echo "::error::qemu executed but failed, exit $code"; exit 1; }
              echo "$out" | grep -q "PASSED" || { echo "::error::expected the PASSED contract message"; exit 1; }
              echo "${{ matrix.platform }}: PASSED (qemu executed)"
            fi
          else
            echo "$out" | grep -q "NO FIRMWARE" || { echo "::error::expected the NO FIRMWARE contract message"; exit 1; }
            [ "$code" -eq 2 ] || { echo "::error::expected exit 2, got $code"; exit 1; }
            echo "${{ matrix.platform }}: PASSED (no-firmware contract)"
          fi
      - name: Run platform tests
        run: eosim test ${{ matrix.platform }}
      - name: Collect artifacts
        run: eosim artifact ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-sim-${{ matrix.platform }}
          path: out/
          retention-days: 7
  cross-platform-verify:
    name: Cross-Platform Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install EoSim
        uses: embeddedos-org/.github/.github/actions/install-eosim@master
        with:
          version: ${{ env.EOSIM_VERSION }}
      - name: Validate all platforms
        run: eosim list && eosim doctor
  sanity-gate:
    name: QEMU Simulation Gate
    if: always()
    needs: [simulate, cross-platform-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Results
        run: |
          echo "════════════════════════════════════════════"
          echo "  QEMU Simulation Results (via EoSim)"
          echo "════════════════════════════════════════════"
          echo "Simulation (8 platforms):      ${{ needs.simulate.result }}"
          echo "Cross-Platform (Win/Lin/Mac):  ${{ needs.cross-platform-verify.result }}"
          echo "════════════════════════════════════════════"
          if [ "${{ needs.simulate.result }}" != "success" ]; then
            echo "❌ Simulation failed"; exit 1
          fi
          if [ "${{ needs.cross-platform-verify.result }}" != "success" ]; then
            echo "❌ Cross-platform verification failed"; exit 1
          fi
          echo "✅ All QEMU simulation checks passed"
