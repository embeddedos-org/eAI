name: Simulation Test

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  EOSIM_VERSION: "3.0.2"

permissions:
  contents: read

jobs:
  simulate:
    name: Simulate (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x86_64-linux, arm64-linux, riscv64-linux, stm32f4, raspi4, esp32, nrf52]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install EoSim from source
        run: |
          git clone --depth 1 --branch v${{ env.EOSIM_VERSION }} https://github.com/embeddedos-org/EoSim.git /tmp/EoSim
          pip install -e /tmp/EoSim
      - name: Validate platform
        run: eosim list
      - name: Run simulation
        shell: bash
        run: |
          # Honest EoSim engine contracts (EoSim 4db3434a fixed #38):
          # - qemu engine: qemu not installed -> "QEMU NOT INSTALLED", exit 2
          #   (reported as SKIP); qemu installed -> it actually executes and
          #   its exit code propagates. Never PASSED without execution.
          # - native engine: "NO FIRMWARE", exit 2 (no fake pass over zeroed
          #   memory). Real firmware execution needs a built image.
          set +e
          out=$(eosim run ${{ matrix.platform }} --headless --timeout 15 2>&1)
          code=$?
          set -e
          echo "$out"
          if echo "$out" | grep -q "via qemu"; then
            if echo "$out" | grep -q "QEMU NOT INSTALLED"; then
              [ "$code" -eq 2 ] || { echo "::error::expected exit 2, got $code"; exit 1; }
              echo "${{ matrix.platform }}: SKIP (qemu not installed)"
            else
              [ "$code" -eq 0 ] || { echo "::error::qemu executed but failed, exit $code"; exit 1; }
              echo "$out" | grep -q "PASSED" || { echo "::error::expected the PASSED contract message"; exit 1; }
              echo "${{ matrix.platform }}: PASSED (qemu executed)"
            fi
          else
            echo "$out" | grep -q "NO FIRMWARE" || { echo "::error::expected the NO FIRMWARE contract message"; exit 1; }
            [ "$code" -eq 2 ] || { echo "::error::expected exit 2, got $code"; exit 1; }
            echo "${{ matrix.platform }}: PASSED (no-firmware contract)"
          fi

  cross-platform:
    name: Cross-Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install EoSim from source
        run: |
          git clone --depth 1 --branch v${{ env.EOSIM_VERSION }} https://github.com/embeddedos-org/EoSim.git /tmp/EoSim
          pip install -e /tmp/EoSim
      - name: Validate
        run: eosim list && eosim doctor

  sanity-gate:
    name: Simulation Gate
    runs-on: ubuntu-latest
    needs: [simulate, cross-platform]
    if: always()
    steps:
      - name: Results
        run: |
          echo "| Job | Status |"
          echo "|---|---|"
          echo "| Simulations | ${{ needs.simulate.result }} |"
          echo "| Cross-platform | ${{ needs.cross-platform.result }} |"
          if [ "${{ needs.simulate.result }}" != "success" ]; then
            echo "❌ Simulations failed"; exit 1
          fi
          if [ "${{ needs.cross-platform.result }}" != "success" ]; then
            echo "❌ Cross-platform validation failed"; exit 1
          fi
          echo "✅ All simulation checks passed"
