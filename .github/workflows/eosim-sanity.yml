name: EoSim Sanity

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  EOSIM_VERSION: "3.0.2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-validate:
    name: Install & Validate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install EoSim from source
        run: |
          git clone --depth 1 --branch v${{ env.EOSIM_VERSION }} https://github.com/embeddedos-org/EoSim.git /tmp/EoSim
          pip install -e /tmp/EoSim
      - name: Verify installation
        run: |
          eosim --version
          eosim list
      - name: Validate all platform configs
        run: eosim list && eosim doctor

  nested-simulation:
    name: Nested Simulation (${{ matrix.platform }})
    needs: install-validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - arm64-linux
          - riscv64-linux
          - stm32f4
          - raspi4
          - esp32
          - nrf52
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install EoSim
        uses: embeddedos-org/.github/.github/actions/install-eosim@master
        with:
          version: ${{ env.EOSIM_VERSION }}
      - name: Simulate ${{ matrix.platform }}
        shell: bash
        run: |
          # Honest EoSim engine contracts (EoSim 4db3434a fixed #38):
          # - qemu engine: qemu not installed -> "QEMU NOT INSTALLED", exit 2
          #   (reported as SKIP); qemu installed -> it actually executes and
          #   its exit code propagates. Never PASSED without execution.
          # - native engine: "NO FIRMWARE", exit 2 (no fake pass over zeroed
          #   memory). Real firmware execution needs a built image.
          set +e
          out=$(eosim run ${{ matrix.platform }} --headless --timeout 10 2>&1)
          code=$?
          set -e
          echo "$out"
          if echo "$out" | grep -q "via qemu"; then
            if echo "$out" | grep -q "QEMU NOT INSTALLED"; then
              [ "$code" -eq 2 ] || { echo "::error::expected exit 2, got $code"; exit 1; }
              echo "${{ matrix.platform }}: SKIP (qemu not installed)"
            else
              [ "$code" -eq 0 ] || { echo "::error::qemu executed but failed, exit $code"; exit 1; }
              echo "$out" | grep -q "PASSED" || { echo "::error::expected the PASSED contract message"; exit 1; }
              echo "${{ matrix.platform }}: PASSED (qemu executed)"
            fi
          else
            echo "$out" | grep -q "NO FIRMWARE" || { echo "::error::expected the NO FIRMWARE contract message"; exit 1; }
            [ "$code" -eq 2 ] || { echo "::error::expected exit 2, got $code"; exit 1; }
            echo "${{ matrix.platform }}: PASSED (no-firmware contract)"
          fi

  nested-guest-install:
    name: Guest OS Install (${{ matrix.guest }})
    needs: install-validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - guest: Linux x86_64
            platform: x86_64-linux
          - guest: Linux aarch64
            platform: arm64-linux
          - guest: Linux riscv64
            platform: riscv64-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install EoSim
        uses: embeddedos-org/.github/.github/actions/install-eosim@master
        with:
          version: ${{ env.EOSIM_VERSION }}
      - name: Boot guest and test EoSim inside
        shell: bash
        run: |
          echo "=== Nested Guest: ${{ matrix.guest }} ==="
          # Honest EoSim engine contracts (EoSim 4db3434a fixed #38):
          # - qemu engine: qemu not installed -> "QEMU NOT INSTALLED", exit 2
          #   (reported as SKIP); qemu installed -> it actually executes and
          #   its exit code propagates. Never PASSED without execution.
          # - native engine: "NO FIRMWARE", exit 2 (no fake pass over zeroed
          #   memory). Real firmware execution needs a built image.
          set +e
          out=$(eosim run ${{ matrix.platform }} --headless --timeout 15 2>&1)
          code=$?
          set -e
          echo "$out"
          if echo "$out" | grep -q "via qemu"; then
            if echo "$out" | grep -q "QEMU NOT INSTALLED"; then
              [ "$code" -eq 2 ] || { echo "::error::expected exit 2, got $code"; exit 1; }
              echo "${{ matrix.guest }}: SKIP (qemu not installed)"
            else
              [ "$code" -eq 0 ] || { echo "::error::qemu executed but failed, exit $code"; exit 1; }
              echo "$out" | grep -q "PASSED" || { echo "::error::expected the PASSED contract message"; exit 1; }
              echo "${{ matrix.guest }}: PASSED (qemu executed)"
            fi
          else
            echo "$out" | grep -q "NO FIRMWARE" || { echo "::error::expected the NO FIRMWARE contract message"; exit 1; }
            [ "$code" -eq 2 ] || { echo "::error::expected exit 2, got $code"; exit 1; }
            echo "${{ matrix.guest }}: PASSED (no-firmware contract)"
          fi

  windows-sanity:
    name: Windows Sanity
    needs: install-validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test EoSim on Windows
        run: |
          git clone --depth 1 --branch v${{ env.EOSIM_VERSION }} https://github.com/embeddedos-org/EoSim.git ${{ runner.temp }}/EoSim
          pip install ${{ runner.temp }}/EoSim
          eosim --version
          eosim list && eosim doctor
          eosim list

  macos-sanity:
    name: macOS Sanity
    needs: install-validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test EoSim on macOS
        run: |
          git clone --depth 1 --branch v${{ env.EOSIM_VERSION }} https://github.com/embeddedos-org/EoSim.git ${{ runner.temp }}/EoSim
          pip install ${{ runner.temp }}/EoSim
          eosim --version
          eosim list && eosim doctor
          eosim list

  sanity-gate:
    name: EoSim Sanity Gate
    if: always()
    needs: [install-validate, nested-simulation, nested-guest-install, windows-sanity, macos-sanity]
    runs-on: ubuntu-latest
    steps:
      - name: Results
        run: |
          echo "════════════════════════════════════════════════"
          echo "  EoSim Sanity Results"
          echo "════════════════════════════════════════════════"
          echo "Install & Validate (3 OS × 3 Py):  ${{ needs.install-validate.result }}"
          echo "Nested Simulation (7 platforms):    ${{ needs.nested-simulation.result }}"
          echo "Nested Guest Install (3 guests):    ${{ needs.nested-guest-install.result }}"
          echo "Windows Sanity:                     ${{ needs.windows-sanity.result }}"
          echo "macOS Sanity:                       ${{ needs.macos-sanity.result }}"
          echo "════════════════════════════════════════════════"
          if [ "${{ needs.install-validate.result }}" != "success" ]; then
            echo "❌ Install/validate failed"; exit 1
          fi
          echo "✅ All EoSim sanity checks passed"
